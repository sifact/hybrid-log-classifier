[project]
name = "hybrid-log-classifier"
version = "0.1.0"
description = "Cost-aware log classification cascade: regex, then BERT + logistic regression, then an LLM only for hard cases."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/log_classifier"]
